name: yuemi-vault

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${YUEMI_IMAGE:-yuemi-vault:local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      YUEMI_DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 3000
      YUEMI_INITIAL_PASSWORD: ${YUEMI_INITIAL_PASSWORD:?Set YUEMI_INITIAL_PASSWORD in .env}
      SMTP_CONFIG_KEY: ${SMTP_CONFIG_KEY:?Set SMTP_CONFIG_KEY in .env}
    volumes:
      - vault_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-51213}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health',{cache:'no-store'}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

  caddy:
    image: caddy:2.10-alpine
    profiles:
      - standalone-https
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal

volumes:
  vault_data:
  caddy_data:
  caddy_config:

networks:
  internal:
